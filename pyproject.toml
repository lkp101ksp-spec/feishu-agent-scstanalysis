[project]
name = "feishu-research-agent"
version = "0.1.0"
description = "Phase 1 demo: IM -> LLM -> Doc (bind-doc flow)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "python-ulid>=2.2.0",
    "sqlalchemy>=2.0.25",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "lark-oapi>=1.7.0",
    # Phase 42 数据画像（dataset_profile.py）：h5py 直读 h5ad + numpy 统计
    "h5py>=3.10.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "pytest-postgresql>=6.0.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "gateway*", "orchestrator*", "feishu_adapter*", "persistence*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 单测试硬上限 300s：正常最慢用例为秒级，超限即网络/TCP 类挂死，
# 宁可误杀也不让整个套件无限挂起（2026-09-09 挂死 40min 事故）
timeout = 300
markers = [
    "pg: 需要 docker compose 的 PostgreSQL 真库（默认无 Docker 时自动 skip）",
]

[tool.ruff]
# 110 覆盖项目自 Phase 1 以来的单行列定义既定风格（最长 108），不做大规模重排
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E701（case x: return y）豁免：块分发/路由表采用紧凑单行风格，为有意为之
ignore = ["E701"]

[tool.ruff.lint.per-file-ignores]
# 测试代码放宽行长与局部命名；docs/scripts 容忍部分风格
"tests/**" = ["E501", "F841", "E741"]

[tool.mypy]
# 宽松基线门禁（2026-09-08 方案 A）：防 Optional 解引用/签名漂移类错误；
# strict 全量为 679 错存量，留待后续分层推进，勿直接开
explicit_package_bases = true  # sandbox\sc_tools 与 st_tools 各有 common.py，防模块名撞车
ignore_missing_imports = true  # lark-oapi/anndata/squidpy 等 103 处无 stub 导入
packages = [
    "gateway", "orchestrator", "sandbox", "shared",
    "persistence", "skills", "feishu_adapter", "config",
]

# 方案 B（2026-09-09）：persistence 层率先提 strict——数据层契约最硬，
# JSON 列 dict[str, Any] 泛型化后可防"裸 dict 装一切"漂移；其余包仍走宽松基线。
# 注意：mypy 2.3.1 实测 overrides 内 strict = true 会泄漏为全局 strict（0→554 错），
# 故显式展开 per-module flags。
[[tool.mypy.overrides]]
module = ["persistence.*", "gateway.*", "orchestrator.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.coverage.run]
source = ["gateway", "orchestrator", "persistence", "feishu_adapter", "shared", "config"]