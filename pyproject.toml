[project]
name = "feishu-research-agent"
version = "0.1.0"
description = "Phase 1 demo: IM -> LLM -> Doc (bind-doc flow)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "python-ulid>=2.2.0",
    "sqlalchemy>=2.0.25",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "lark-oapi>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "pytest-postgresql>=6.0.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "gateway*", "orchestrator*", "feishu_adapter*", "persistence*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "pg: 需要 docker compose 的 PostgreSQL 真库（默认无 Docker 时自动 skip）",
]

[tool.ruff]
# 110 覆盖项目自 Phase 1 以来的单行列定义既定风格（最长 108），不做大规模重排
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E701（case x: return y）豁免：块分发/路由表采用紧凑单行风格，为有意为之
ignore = ["E701"]

[tool.ruff.lint.per-file-ignores]
# 测试代码放宽行长与局部命名；docs/scripts 容忍部分风格
"tests/**" = ["E501", "F841", "E741"]

[tool.coverage.run]
source = ["gateway", "orchestrator", "persistence", "feishu_adapter", "shared", "config"]