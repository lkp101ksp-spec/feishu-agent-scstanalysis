[project]
name = "feishu-research-agent"
version = "0.1.0"
description = "飞书科研闭环 Agent：IM 进、报告出——LLM 规划 DAG，断网 Docker 沙箱执行单细胞/空间转录组分析（61 内置工具）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "python-ulid>=2.2.0",
    "sqlalchemy>=2.0.25",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "lark-oapi>=1.7.0",
    # Phase 42 数据画像（dataset_profile.py）：h5py 直读 h5ad + numpy 统计
    "h5py>=3.10.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "pytest-postgresql>=6.0.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "gateway*", "orchestrator*", "feishu_adapter*", "persistence*", "config*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 单测试硬上限 300s：正常最慢用例为秒级，超限即网络/TCP 类挂死，
# 宁可误杀也不让整个套件无限挂起（2026-09-09 挂死 40min 事故）
timeout = 300
markers = [
    "pg: 需要 docker compose 的 PostgreSQL 真库（默认无 Docker 时自动 skip）",
]

[tool.ruff]
# 110 覆盖项目自 Phase 1 以来的单行列定义既定风格（最长 108），不做大规模重排
line-length = 110
target-version = "py310"
# 真机验收 scratch 目录（测试 zip 源文件非项目代码，不入门禁）；
# .skill_backups 为 skill 覆盖安装的旧版本备份（installer 落盘，非项目代码）
extend-exclude = ["tmp_skill_accept", ".skill_backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E701（case x: return y）豁免：块分发/路由表采用紧凑单行风格，为有意为之
ignore = ["E701"]

[tool.ruff.lint.per-file-ignores]
# 测试代码放宽行长与局部命名；docs/scripts 容忍部分风格
"tests/**" = ["E501", "F841", "E741"]

[tool.mypy]
# 全库 strict（2026-09-10 收官）：方案 B（persistence）→ 方案 C（gateway/orchestrator）
# → 第三批（feishu_adapter/config/shared/sandbox，skills 本就 0 错）逐层清零后，
# strict flags 从 per-module overrides 升为全局——此时全库等价，且彻底规避
# mypy 2.3.1 "overrides 内 strict = true 泄漏为全局"的坑（已无泄漏与否的问题）。
explicit_package_bases = true  # sandbox\sc_tools 与 st_tools 各有 common.py，防模块名撞车
ignore_missing_imports = true  # lark-oapi/anndata/squidpy 等 103 处无 stub 导入
packages = [
    "gateway", "orchestrator", "sandbox", "shared",
    "persistence", "skills", "feishu_adapter", "config",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.coverage.run]
source = ["gateway", "orchestrator", "persistence", "feishu_adapter", "shared", "config"]