# CI 工作流（预置）：当前仓库无远程，推送到 GitHub 后立即生效。
# 与本地质量门 scripts/check.ps1 完全对齐：ruff check → pytest 默认层（+cov）→ pg 真库层。
# 注意：依赖安装用 pip install -e .[dev]，不用 requirements-lock.txt——
# lock 文件含 "-e i:\飞书agent" 本地绝对路径自引用，仅用于本机环境复现。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # 手动触发：bio 镜像全量构建冒烟（bio-image-smoke job 仅此事件生效）
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # pg 真库层（-m pg）：端口/账号与 tests/pg/conftest.py 默认 PG_TEST_URL 完全匹配，
      # 无需额外环境变量；docker 测试因 kernel 镜像不存在自动 skip（见 test_sandbox_docker.py）。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 安装依赖（锁文件钉版 + 项目本体无依赖安装）
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: ruff check（lint 硬门禁）
        run: ruff check .

      - name: mypy 宽松基线（硬门禁；范围/开关见 pyproject [tool.mypy]）
        run: python -m mypy

      - name: pytest 默认层 + cov（与 check.ps1 一致）
        # -v：段错误/崩溃时摘要不会打印，逐测试命名才能在日志里定位肇事测试
        run: python -m pytest -v -m "not pg" --cov --cov-report=term

      - name: pytest pg 真库层
        run: python -m pytest tests/pg -m pg -q

  # kernel 镜像冒烟（每次 push/PR）：镜像构建轻量（python:3.11-slim + 三个
  # 基础包），构建后 tests/integration/test_sandbox_docker.py 的 skipif
  # 探测自动激活，跑真容器四用例（print/numpy/错误/超时重建）。
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 安装依赖（kernel 集成测试需项目本体）
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: 构建 kernel 镜像
        run: >-
          docker build -t feishu-research-agent/kernel:latest
          sandbox -f sandbox/kernel.Dockerfile

      - name: kernel 真容器集成冒烟
        run: python -m pytest tests/integration/test_sandbox_docker.py -v

  # bio 镜像冒烟（仅手动触发）：全量构建含 R/CellChat 编译链（CellChat 层
  # 探针实测 11min/轮、全镜像数十分钟级），进 PR 门禁不可行，故仅
  # workflow_dispatch。PROXY 置空：默认 ARG 指向宿主 clash portproxy，
  # CI runner 直连 GitHub/Bioconductor 无需代理。
  bio-image-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 冒烟脚本宿主侧依赖（pandas 断言产物 CSV）
        run: pip install pandas

      - name: 构建 bio 镜像（PROXY 置空走直连）
        run: >-
          docker build --build-arg PROXY=
          -t feishu-research-agent/bio:cpu-latest
          sandbox -f sandbox/bio.Dockerfile

      - name: sc_cellchat 合成冒烟（480 细胞断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_sc_cellchat.py
