# CI 工作流：与本地质量门 scripts/check.ps1 对齐（ruff → mypy → pytest 默认层 + pg 层），
# 另含 docker/kernel 冒烟与 pip-audit 依赖 CVE 扫描。
# 依赖安装：pip install -r requirements-lock.txt + pip install -e . --no-deps（ADR-0028）。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # 手动触发：bio/st 镜像全量构建冒烟（仅此事件与周检 schedule 生效）
  workflow_dispatch:
  # 周检（2026-09-23）：每周一 02:00（北京时间）= 周日 18:00 UTC。
  # test/docker-smoke job 无 if 条件故周检时也会全量跑（顺带周频 pip-audit
  # 扫新公布 CVE）；bio/st-image-smoke 双 job 重建镜像+全冒烟，防上游基础
  # 镜像漂移与构建链腐化。
  schedule:
    - cron: "0 18 * * 0"

# 注：actions 钉新版（checkout@v5/setup-python@v6 走 Node24）；runner 钉
# ubuntu-24.04（ubuntu-latest 2026-10-19 起 migrates to Ubuntu 26，防漂移）。
jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      # pg 真库层（-m pg）：端口/账号与 tests/pg/conftest.py 默认 PG_TEST_URL 完全匹配，
      # 无需额外环境变量；docker 测试因 kernel 镜像不存在自动 skip（见 test_sandbox_docker.py）。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 安装依赖（锁文件钉版 + 项目本体无依赖安装）
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: pip-audit 依赖 CVE 扫描（硬门禁；直接审锁文件，与 runner pip 版本解耦）
        run: python -m pip_audit -r requirements-lock.txt

      - name: ruff check（lint 硬门禁）
        run: ruff check .

      - name: mypy 宽松基线（硬门禁；范围/开关见 pyproject [tool.mypy]）
        run: python -m mypy

      - name: pytest 默认层 + cov（与 check.ps1 一致）
        # -v：段错误/崩溃时摘要不会打印，逐测试命名才能在日志里定位肇事测试
        run: python -m pytest -v -m "not pg" --cov --cov-report=term

      - name: pytest pg 真库层
        run: python -m pytest tests/pg -m pg -q

  # kernel 镜像冒烟（每次 push/PR）：镜像构建轻量（python:3.11-slim + 三个
  # 基础包），构建后 tests/integration/test_sandbox_docker.py 的 skipif
  # 探测自动激活，跑真容器四用例（print/numpy/错误/超时重建）。
  docker-smoke:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 安装依赖（kernel 集成测试需项目本体）
        run: |
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: 构建 kernel 镜像
        run: >-
          docker build -t feishu-research-agent/kernel:latest
          sandbox -f sandbox/kernel.Dockerfile

      - name: kernel 真容器集成冒烟
        run: python -m pytest tests/integration/test_sandbox_docker.py -v

  # bio 镜像冒烟（手动触发 + 每周 schedule 周检）：全量构建含 R/CellChat 编译链（CellChat 层
  # 探针实测 11min/轮、全镜像数十分钟级），进 PR 门禁不可行，故仅
  # workflow_dispatch。PROXY 置空：默认 ARG 指向宿主 clash portproxy，
  # CI runner 直连 GitHub/Bioconductor 无需代理。
  bio-image-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 冒烟脚本宿主侧依赖（pandas/anndata/scanpy 宿主造数与产物断言）
        run: pip install pandas anndata scanpy numpy

      - name: 构建 bio 镜像（PROXY 置空走直连）
        run: >-
          docker build --build-arg PROXY= --build-arg GH_PAT=${{ secrets.GITHUB_TOKEN }}
          -t feishu-research-agent/bio:cpu-latest
          sandbox -f sandbox/bio.Dockerfile

      - name: 预创建 workspace 目录（runner 属主，防 bind-mount root 自动创建）
        # docker -v 宿主路径不存在时由 dockerd 以 root 自动创建；sc_cellchat 冒烟
        # 合成数据在容器内写 /ws（首次触碰即 root），后续宿主侧 mkdir
        # （_smoke_sc_nichenet 步骤 0 的 _eval/_nnpeek）会被 EACCES 拒绝。
        # 先由 runner 建目录，docker 复用已存在目录，属主保持 runner。
        run: mkdir -p "${RUNNER_TEMP}/bio_ws/_eval"

      - name: sc_cellchat 合成冒烟（480 细胞断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_sc_cellchat.py

      - name: sc_nichenet 合成冒烟（A2M 自证+三拒收断网端到端；步骤 0 从镜像先验 RDS 导出真名）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_sc_nichenet.py

      - name: st_nichenet 合成冒烟（空间网格 A2M 自证+诱饵空间过滤+四拒收断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_st_nichenet.py

      - name: st_niche_scan 合成冒烟（三 niche 批量扫描+R 区 A2M 真值锚自证+三拒收断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_st_niche_scan.py

      - name: sc_integrate harmony 合成冒烟（双批 bbknn/harmony 双引擎对照+三拒收断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_sc_integrate_harmony.py

      - name: st_integrate 合成冒烟（双切片批次效应+offset+bbknn 引擎+六拒收断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_st_integrate.py

      - name: sc_tcr 合成冒烟（免疫组库重建：六重过滤+跨组织 clonotype+Startrac 真值+写回两分支+四拒收断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_sc_tcr.py

      - name: sc_cytosig 合成冒烟（TGFB1 注入双口径断层+per_cell 群汇总+噪声对照+三拒收断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_sc_cytosig.py

      - name: sc_genescore 合成冒烟（TGFb 权重注入真值回收+组均值/方差双判据+三拒收断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_sc_genescore.py

      - name: sc_metabolism 合成冒烟（Glycolysis 信号注入 AUCell/mean 双口径+方差 rank 判据+method 拒收断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_sc_metabolism.py

      - name: sc_cellfreq 合成冒烟（已知偏向 Fisher/Ro-e+三值降级+6 样本共现网络真值+off-switch 静默断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_sc_cellfreq.py

      - name: st_genescore 合成冒烟（空间网格+TGFb 注入真值回收+spatial 图落盘+三拒收断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_st_genescore.py

      - name: st_metabolism 合成冒烟（空间网格+Glycolysis 注入 AUCell/mean 双口径+spatial 图落盘+拒收断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_st_metabolism.py

      - name: st_score_weight 合成冒烟（q05 丰度×scores 真值回收+全零型剔除+三拒收断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_st_score_weight.py

  # st 镜像冒烟（手动触发 + 每周 schedule 周检，与 bio-image-smoke 同规）：st.Dockerfile 无
  # GitHub 源/代理 ARG（纯 PyPI+CRAN 层），直连构建即可；冒烟跑最轻量的
  # st_stats 合成网格三分析（其余 _smoke_st_*.py 已同款 env 化，可按需加）。
  st-image-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 冒烟脚本宿主侧依赖（st_stats 宿主造合成 h5ad）
        run: pip install numpy pandas scipy scanpy anndata

      - name: 构建 st 镜像
        run: >-
          docker build -t feishu-research-agent/bio:st-cpu-latest
          sandbox -f sandbox/st.Dockerfile

      - name: 预创建 workspace 目录（runner 属主，同 bio-image-smoke 根因防御）
        run: mkdir -p "${RUNNER_TEMP}/bio_ws"

      - name: st_stats 合成冒烟（10×10 网格断网端到端）
        env:
          BIO_WORKSPACE_ROOT: ${{ runner.temp }}/bio_ws
        run: python scripts/_smoke_st_stats.py
