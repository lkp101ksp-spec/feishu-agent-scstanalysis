# Phase 10: 本地 PostgreSQL 16（端口 5433 避让本机 5432，ADR-0029）
# 启动：docker compose up -d postgres
# 跑 pg 层测试：pytest -m pg -q
services:
  postgres:
    image: postgres:16-alpine
    container_name: feishu-agent-pg
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10
